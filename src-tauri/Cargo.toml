# Cargo workspace — two members:
#   • app     — the Tauri shell (webkit2gtk / WRY / GTK); only built for cargo tauri dev/build
#   • metrics — pure Rust metrics logic; used for cargo check/test (no webkit2gtk)
[workspace]
members = [".", "crates/metrics"]
resolver = "2"

[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.4", features = [] }

[dependencies]
serde_json = "1.0"
serde      = { version = "1.0", features = ["derive"] }
tokio      = { version = "1", features = ["rt", "rt-multi-thread", "time", "macros"] }
tauri      = { version = "2.10.0", features = [] }
metrics    = { path = "crates/metrics" }

# ── Build profiles ─────────────────────────────────────────────────────────────
# webkit2gtk-sys/src/lib.rs is a 255 KB pre-generated FFI binding file.
# LLVM must hold its entire IR in one translation unit regardless of codegen-units.
# Strategy: keep codegen-units low so we don't *add* extra parallel LLVM instances
# on top of that unavoidable cost; run opt-level 1 on deps (not 3) to reduce IR size.

[profile.dev]
opt-level      = 0
codegen-units  = 4
debug          = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level     = 1
codegen-units = 4

[profile.test]
inherits = "dev"
